# Week 1 smoke: synthetic target, capacity = CONCURRENCY_LIMIT / SERVICE_TIME = 100 req/s (dev host, not comparable).
name: week1_smoke
seed: 1
target:
  image: serverlab-synthetic
  build_context: .
  dockerfile: targets/synthetic/Dockerfile
  env: {CONCURRENCY_LIMIT: "10", SERVICE_TIME_MS: "100"}
  port: 8000
k6_image: grafana/k6@sha256:e66db15b860113878fa74670e31f5e274830b7b6e42c8bff28b2f2d86a257603
load:
  rate: 50
  duration_s: 20
  pre_allocated_vus: 10
  max_vus: 100
  url: http://sut:8000/work
cpus: {sut: [0, 1], load: [2]}
warmup_s: 5
cooldown_s: 2
